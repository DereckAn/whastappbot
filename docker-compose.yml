services:
  whatsapp-bot:
    build: .
    container_name: whatsapp-media-bot
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./data/credentials:/data/credentials:ro  # Read-only for security
      - gallery-dl-config:/root/.config/gallery-dl
    env_file:
      - .env
    environment:
      UI_HOST: 0.0.0.0  # dentro del contenedor; el puerto solo se publica en localhost
    ports:
      - "127.0.0.1:3000:3000"
    stdin_open: true  # Needed for QR code scanning
    tty: true

volumes:
  gallery-dl-config:
